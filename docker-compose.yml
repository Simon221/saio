services:
  db:
    image: postgres:16-alpine
    container_name: saio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: saio
      POSTGRES_PASSWORD: saio
      POSTGRES_DB: saio
    ports:
      - "5434:5432"
    volumes:
      - saio-db-data:/var/lib/postgresql/data

volumes:
  saio-db-data:
